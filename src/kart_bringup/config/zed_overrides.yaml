# ZED camera parameter overrides for kart_brain
# These override the defaults in zed_wrapper/config/common_stereo.yaml
/**:
    ros__parameters:
        general:
            pub_frame_rate: 100.0  # Match VGA@100 grab rate (default 30.0)
        depth:
            point_cloud_freq: 30.0  # Keep point cloud at 30 Hz to save GPU
