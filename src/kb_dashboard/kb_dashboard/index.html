<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kart Dashboard</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141f;
    --border: #2a2a3a;
    --text: #e0e0e8;
    --dim: #6a6a7a;
    --accent: #4a9eff;
    --green: #2ecc71;
    --red: #e74c3c;
    --orange: #f39c12;
    --yellow: #f1c40f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 12px; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 12px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .conn-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--red); transition: background 0.3s;
  }
  .conn-dot.ok { background: var(--green); }

  .status-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .status-pill {
    flex: 1; text-align: center; padding: 6px 4px;
    border-radius: 8px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--card); border: 1px solid var(--border);
  }
  .status-pill.active { border-color: var(--accent); color: var(--accent); }
  .status-pill.heartbeat-ok { border-color: var(--green); color: var(--green); }
  .status-pill.heartbeat-bad { border-color: var(--red); color: var(--red); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .card-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--dim); margin-bottom: 10px;
  }

  .telem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .telem-item { background: var(--bg); border-radius: 8px; padding: 10px; }
  .telem-label {
    font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .telem-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .telem-unit { font-size: 12px; color: var(--dim); font-weight: 400; }
  .telem-alt { font-size: 13px; color: var(--accent); font-weight: 500; margin-left: 4px; }

  /* Steering bar */
  .steer-bar-bg {
    width: 100%; height: 24px; background: var(--bg);
    border-radius: 12px; position: relative; overflow: hidden;
  }
  .steer-bar-center {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; background: var(--dim); transform: translateX(-50%);
  }
  .steer-bar-fill {
    position: absolute; top: 2px; bottom: 2px;
    background: var(--accent); border-radius: 10px;
    transition: left 0.1s, width 0.1s;
  }
  .steer-bar-cmd {
    position: absolute; top: 0; bottom: 0; width: 3px;
    background: var(--orange); border-radius: 2px;
    transition: left 0.1s;
  }

  /* G-G diagram */
  .gg-row {
    display: flex; gap: 10px; align-items: center; margin-top: 8px;
  }
  .gg-container {
    position: relative; width: 140px; height: 140px; flex-shrink: 0;
  }
  .gg-canvas {
    width: 100%; height: 100%; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
  }
  .gg-labels {
    flex: 1; display: flex; flex-direction: column; gap: 4px;
  }
  .gg-val {
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .gg-val-label { font-size: 10px; color: var(--dim); text-transform: uppercase; }

  /* Pedal bars */
  .pedal-row { display: flex; gap: 10px; margin-top: 10px; }
  .pedal-item { flex: 1; }
  .pedal-label {
    font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 4px;
    display: flex; justify-content: space-between;
  }
  .pedal-label span { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pedal-track {
    width: 100%; height: 20px; background: var(--bg);
    border-radius: 10px; overflow: hidden;
  }
  .pedal-fill {
    height: 100%; border-radius: 10px;
    transition: width 0.1s;
  }
  .pedal-fill.throttle { background: var(--green); }
  .pedal-fill.brake { background: var(--red); }

  /* Target section */
  .target-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  }
  .target-item {
    background: var(--bg); border-radius: 8px; padding: 8px; text-align: center;
  }
  .target-label {
    font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 2px;
  }
  .target-value {
    font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--orange);
  }

  /* Mission buttons */
  .mission-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .mission-btn {
    padding: 12px 4px; border-radius: 8px; border: 2px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; text-align: center;
    -webkit-user-select: none; user-select: none;
  }
  .mission-btn:active { transform: scale(0.95); }
  .mission-btn.selected {
    border-color: var(--accent); background: rgba(74,158,255,0.12);
    color: var(--accent);
  }
  .control-row { display: flex; gap: 8px; margin-top: 10px; }
  .ctrl-btn {
    flex: 1; padding: 16px 8px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.15s; text-transform: uppercase;
    -webkit-user-select: none; user-select: none;
  }
  .ctrl-btn:active { transform: scale(0.96); }
  .ctrl-btn.go { background: var(--green); color: #fff; }
  .ctrl-btn.stop { background: var(--red); color: #fff; }
  .ctrl-btn.ebs { background: var(--orange); color: #fff; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>UM Driverless</h1>
    <div class="conn-dot" id="connDot"></div>
  </div>

  <div class="status-bar">
    <div class="status-pill" id="pillState">IDLE</div>
    <div class="status-pill" id="pillMission">MANUAL</div>
    <div class="status-pill" id="pillHeartbeat">HB --</div>
  </div>

  <!-- ACTUAL STATE (sensor readings) -->
  <div class="card">
    <div class="card-title">Kart State</div>
    <div class="telem-grid">
      <div class="telem-item">
        <div class="telem-label">Steering</div>
        <div class="telem-value" id="valSteer">0.000 <span class="telem-unit">rad</span></div>
      </div>
      <div class="telem-item">
        <div class="telem-label">Speed</div>
        <div class="telem-value" id="valSpeed">0.0 <span class="telem-unit">km/h</span></div>
      </div>
    </div>
    <!-- Steering bar -->
    <div style="margin-top: 8px;">
      <div class="steer-bar-bg">
        <div class="steer-bar-center"></div>
        <div class="steer-bar-fill" id="steerFill"></div>
        <div class="steer-bar-cmd" id="steerCmd"></div>
      </div>
    </div>
    <!-- G-G diagram + values -->
    <div class="gg-row">
      <div class="gg-container">
        <canvas class="gg-canvas" id="ggCanvas" width="140" height="140"></canvas>
      </div>
      <div class="gg-labels">
        <div>
          <div class="gg-val-label">Lateral</div>
          <div class="gg-val" id="valAccelLat">0.00 g</div>
        </div>
        <div>
          <div class="gg-val-label">Longitudinal</div>
          <div class="gg-val" id="valAccelLon">0.00 g</div>
        </div>
        <div>
          <div class="gg-val-label">Total</div>
          <div class="gg-val" id="valAccelTotal">0.00 g</div>
        </div>
      </div>
    </div>
    <!-- Pedal bars -->
    <div class="pedal-row">
      <div class="pedal-item">
        <div class="pedal-label">Throttle <span id="valThrottle">0%</span></div>
        <div class="pedal-track"><div class="pedal-fill throttle" id="throttleFill" style="width:0%"></div></div>
      </div>
      <div class="pedal-item">
        <div class="pedal-label">Brake <span id="valBrake">0%</span></div>
        <div class="pedal-track"><div class="pedal-fill brake" id="brakeFill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- TARGET VALUES (what Orin commands) -->
  <div class="card">
    <div class="card-title">Targets</div>
    <div class="target-grid">
      <div class="target-item">
        <div class="target-label">Steering</div>
        <div class="target-value" id="cmdSteer">0.0°</div>
      </div>
      <div class="target-item">
        <div class="target-label">Throttle</div>
        <div class="target-value" id="cmdThrottle">0%</div>
      </div>
      <div class="target-item">
        <div class="target-label">Brake</div>
        <div class="target-value" id="cmdBrake">0%</div>
      </div>
    </div>
  </div>

  <!-- MISSION -->
  <div class="card">
    <div class="card-title">Mission</div>
    <div class="mission-grid" id="missionGrid">
      <button class="mission-btn selected" data-mission="manual">Manual</button>
      <button class="mission-btn" data-mission="acceleration">Accel</button>
      <button class="mission-btn" data-mission="skidpad">Skidpad</button>
      <button class="mission-btn" data-mission="autocross">Autocross</button>
      <button class="mission-btn" data-mission="trackdrive">Trackdrive</button>
      <button class="mission-btn" data-mission="inspection">Inspect</button>
    </div>
    <div class="control-row">
      <button class="ctrl-btn go" onclick="sendState('running')">START</button>
      <button class="ctrl-btn stop" onclick="sendState('idle')">STOP</button>
      <button class="ctrl-btn ebs" onclick="sendState('ebs')">EBS</button>
    </div>
  </div>
</div>

<script>
const WS_URL = `ws://${location.host}/ws`;
let ws = null;
let reconnectTimer = null;

// G-G diagram setup
const ggCanvas = document.getElementById('ggCanvas');
const ggCtx = ggCanvas.getContext('2d');
const GG_MAX = 2.0; // max g displayed
const GG_R = 65; // plot radius in px
const GG_CX = 70, GG_CY = 70; // center

function drawGG(latG, lonG) {
  const ctx = ggCtx;
  ctx.clearRect(0, 0, 140, 140);

  // Background circles
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 1;
  for (let r = 1; r <= 2; r++) {
    ctx.beginPath();
    ctx.arc(GG_CX, GG_CY, GG_R * r / GG_MAX, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Crosshair
  ctx.strokeStyle = '#1a1a2a';
  ctx.beginPath();
  ctx.moveTo(GG_CX - GG_R, GG_CY);
  ctx.lineTo(GG_CX + GG_R, GG_CY);
  ctx.moveTo(GG_CX, GG_CY - GG_R);
  ctx.lineTo(GG_CX, GG_CY + GG_R);
  ctx.stroke();

  // Dot
  const px = GG_CX + (latG / GG_MAX) * GG_R;
  const py = GG_CY - (lonG / GG_MAX) * GG_R; // up = positive lon
  ctx.fillStyle = '#4a9eff';
  ctx.shadowColor = '#4a9eff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(px, py, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Trail dot (dimmer, smaller)
  ctx.fillStyle = 'rgba(74,158,255,0.3)';
  ctx.beginPath();
  ctx.arc(px, py, 8, 0, Math.PI * 2);
  ctx.fill();
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('connDot').classList.add('ok');
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
  };
  ws.onclose = () => {
    document.getElementById('connDot').classList.remove('ok');
    if (!reconnectTimer) reconnectTimer = setInterval(connect, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => { try { update(JSON.parse(e.data)); } catch {} };
}

function update(d) {
  const deg = (r) => (r * 180 / Math.PI).toFixed(1);

  // Steering + speed
  el('valSteer').innerHTML = `${d.esp32_steering_rad.toFixed(3)} <span class="telem-unit">rad</span> <span class="telem-alt">${deg(d.esp32_steering_rad)}°</span>`;
  el('valSpeed').innerHTML = `${(d.esp32_speed * 3.6).toFixed(1)} <span class="telem-unit">km/h</span> <span class="telem-alt">${d.esp32_speed.toFixed(2)} m/s</span>`;

  // Steering bar
  const maxRad = 0.5;
  const pct = Math.max(-1, Math.min(1, d.esp32_steering_rad / maxRad));
  const fill = el('steerFill');
  if (pct >= 0) { fill.style.left = '50%'; fill.style.width = (pct * 50) + '%'; }
  else { fill.style.width = (-pct * 50) + '%'; fill.style.left = (50 + pct * 50) + '%'; }
  const cmdPct = Math.max(-1, Math.min(1, d.orin_cmd_steering_rad / maxRad));
  el('steerCmd').style.left = (50 + cmdPct * 50 - 0.5) + '%';

  // G-G diagram
  const latG = d.esp32_accel_lat / 9.81;
  const lonG = d.esp32_accel_lon / 9.81;
  const totalG = Math.sqrt(latG * latG + lonG * lonG);
  drawGG(latG, lonG);
  el('valAccelLat').textContent = latG.toFixed(2) + ' g';
  el('valAccelLon').textContent = lonG.toFixed(2) + ' g';
  el('valAccelTotal').textContent = totalG.toFixed(2) + ' g';

  // Pedals (0.0-1.0)
  const tPct = Math.round(d.esp32_throttle * 100);
  const bPct = Math.round(d.esp32_braking * 100);
  el('valThrottle').textContent = tPct + '%';
  el('valBrake').textContent = bPct + '%';
  el('throttleFill').style.width = tPct + '%';
  el('brakeFill').style.width = bPct + '%';

  // Targets
  el('cmdSteer').innerHTML = `${deg(d.orin_cmd_steering_rad)}° <span style="font-size:11px;color:var(--dim)">${d.orin_cmd_steering_rad.toFixed(3)}</span>`;
  el('cmdThrottle').textContent = Math.round(d.orin_cmd_throttle / 255 * 100) + '%';
  el('cmdBrake').textContent = Math.round(d.orin_cmd_brake / 255 * 100) + '%';

  // Status pills
  const pillState = el('pillState');
  pillState.textContent = d.state.toUpperCase();
  pillState.className = 'status-pill' + (d.state === 'running' ? ' active' : '');

  el('pillMission').textContent = d.mission.toUpperCase();
  el('pillMission').className = 'status-pill active';

  const pillHb = el('pillHeartbeat');
  if (d.esp32_heartbeat_age < 0) {
    pillHb.textContent = 'HB --';
    pillHb.className = 'status-pill';
  } else {
    pillHb.textContent = d.esp32_heartbeat ? `HB ${d.esp32_heartbeat_age}s` : `HB LOST ${d.esp32_heartbeat_age}s`;
    pillHb.className = 'status-pill ' + (d.esp32_heartbeat ? 'heartbeat-ok' : 'heartbeat-bad');
  }

  document.querySelectorAll('.mission-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.mission === d.mission);
  });
}

document.getElementById('missionGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('.mission-btn');
  if (!btn || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ action: 'set_mission', mission: btn.dataset.mission }));
});

function sendState(state) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ action: 'set_state', state }));
}

function el(id) { return document.getElementById(id); }

drawGG(0, 0);
connect();
</script>
</body>
</html>
