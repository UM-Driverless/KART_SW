<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Ü MOTORSPORT · Telemetría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Titillium+Web:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080a;
    --gunmetal:#111113;
    --panel:#141416;
    --panel-raised:#1c1c1f;
    --line:#2c2c2f;
    --line-hard:#3a3a3d;
    --red:#e2001a;
    --red-glow:#ff2438;
    --red-dark:#5c0009;
    --white:#f2f2f0;
    --label:#84848a;
    --label-dim:#54545a;
    --amber:#ffb020;
    --green:#33d17a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--void);
    color:var(--white);
    font-family:'Titillium Web',sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .num{font-family:'Orbitron',sans-serif;font-weight:700;}
  .num-alt{font-family:'Rajdhani',sans-serif;font-weight:700;}

  /* subtle carbon-fibre weave */
  .carbon{
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px, transparent 1px, transparent 5px);
    background-color:var(--gunmetal);
  }

  /* orientation guard */
  #rotateGuard{
    display:none;position:fixed;inset:0;background:var(--void);z-index:999;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;
  }
  @media (orientation: portrait){ #rotateGuard{display:flex;} #app{display:none;} }
  #rotateGuard svg{width:52px;height:52px;stroke:var(--red);}
  #rotateGuard p{color:var(--label);font-size:13px;letter-spacing:.08em;text-transform:uppercase;}

  #app{
    width:100vw;height:100vh;
    display:grid;
    grid-template-rows:auto 1fr 40px;
    position:relative;
  }

  /* hazard stripe divider */
  .hazard{
    height:5px;width:100%;
    background:repeating-linear-gradient(-45deg, var(--red) 0 8px, #0d0d0e 8px 16px);
    opacity:.9;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(226,0,26,.55));}
  .brand .name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--red);text-shadow:0 0 12px rgba(226,0,26,.4);}
  .brand .sub{font-size:9.5px;color:var(--label);letter-spacing:.18em;text-transform:uppercase;margin-top:2px;font-weight:700;}

  .live{display:flex;align-items:center;gap:8px;}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red-glow);animation:pulse 1.4s ease-in-out infinite;}
  .live span{font-size:10px;letter-spacing:.18em;color:var(--label);font-weight:700;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .fullscreen-btn{
    background:var(--panel-raised);border:1px solid var(--line-hard);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    color:var(--label);cursor:pointer;margin-left:14px;
    clip-path:polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  .fullscreen-btn:active{background:var(--red-dark);color:var(--white);}
  .fullscreen-btn svg{width:15px;height:15px;}

  /* ---------- MAIN ---------- */
  .main{
    display:grid;
    grid-template-columns: 1fr 1.35fr 1fr;
    padding:8px 10px;
    gap:8px;
    overflow:hidden;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    position:relative;
    clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), inset 0 2px 10px rgba(0,0,0,.5);
  }
  .panel .corner-accent{
    position:absolute;top:0;right:0;width:16px;height:16px;
    background:linear-gradient(135deg, transparent 49%, var(--red) 50%);
  }
  .rivet{
    position:absolute;width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #4a4a4d, #0c0c0d 70%);
    box-shadow:0 0 0 1px rgba(0,0,0,.6);
  }
  .rivet.tl{top:6px;left:6px;}
  .rivet.bl{bottom:6px;left:6px;}

  /* ---- Steering panel ---- */
  .steer{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px 6px;}
  .steer .label-row{width:100%;display:flex;justify-content:center;padding:0 4px;}
  .panel-label{font-size:10.5px;letter-spacing:.2em;color:var(--label);text-transform:uppercase;font-weight:700;}
  .steer svg{width:96%;height:auto;max-height:66%;}
  .steer .angle-value{
    font-size:clamp(30px,5.5vh,46px);
    line-height:1;margin-top:-8px;
    display:flex;align-items:baseline;gap:6px;
  }
  .steer .angle-value .unit{font-size:14px;color:var(--label);font-weight:700;font-family:'Titillium Web';letter-spacing:.06em;}
  .dir-bar{width:82%;height:6px;background:var(--panel-raised);position:relative;margin-top:8px;overflow:hidden;border:1px solid var(--line);}
  .dir-bar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line-hard);}
  .dir-bar .fill{position:absolute;top:0;bottom:0;background:var(--red);box-shadow:0 0 8px var(--red-glow);}
  .lr-labels{width:82%;display:flex;justify-content:space-between;font-size:9px;color:var(--label-dim);letter-spacing:.14em;margin-top:5px;font-weight:700;}

  /* ---- Speed panel ---- */
  .speedhero{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .speedhero::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(226,0,26,.09) 50%, transparent 60%);
    pointer-events:none;
  }
  .speedhero .panel-label{position:absolute;top:12px;left:16px;}
  .speed-value{
    font-size:clamp(72px,17vh,152px);
    line-height:.88;
    display:flex;align-items:flex-end;gap:10px;
    text-shadow:0 0 30px rgba(226,0,26,.35);
    letter-spacing:.02em;
  }
  .speed-value .unit{
    font-size:clamp(15px,2.4vh,20px);
    font-family:'Rajdhani',sans-serif;
    color:var(--label);font-weight:700;padding-bottom:.6em;letter-spacing:.08em;
  }
  .accel-track{width:70%;height:6px;background:var(--panel-raised);margin-top:2vh;position:relative;overflow:hidden;border:1px solid var(--line);}
  .accel-track .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line-hard);}
  .accel-track .fill{position:absolute;top:0;bottom:0;transition:width .15s linear,left .15s linear;}
  .accel-caption{font-size:9.5px;color:var(--label-dim);letter-spacing:.16em;margin-top:7px;text-transform:uppercase;font-weight:700;}

  /* ---- Telemetry stack ---- */
  .stack{display:flex;flex-direction:column;gap:6px;padding:2px;height:100%;}
  .tele-card{
    background:var(--panel);border:1px solid var(--line);flex:1;
    display:flex;flex-direction:column;justify-content:center;padding:10px 16px;
    position:relative;
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), inset 0 2px 8px rgba(0,0,0,.5);
  }
  .tele-card .row1{display:flex;justify-content:space-between;align-items:baseline;}
  .tele-card .val{font-family:'Orbitron',sans-serif;font-weight:700;font-size:27px;display:flex;align-items:baseline;gap:5px;}
  .tele-card .val .u{font-size:11px;color:var(--label);font-weight:600;font-family:'Titillium Web';}
  .bar-track{width:100%;height:5px;background:var(--panel-raised);margin-top:8px;overflow:hidden;border:1px solid var(--line);}
  .bar-track .fill{height:100%;transition:width .3s ease;}

  /* ---------- BOTTOM BAR ---------- */
  .bottombar{
    display:flex;align-items:center;gap:16px;
    padding:0 16px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .pedal{display:flex;align-items:center;gap:8px;flex:1;max-width:220px;}
  .pedal .lbl{font-size:9px;color:var(--label);letter-spacing:.14em;width:44px;text-transform:uppercase;font-weight:700;}
  .pedal .track{flex:1;height:7px;background:var(--panel-raised);overflow:hidden;border:1px solid var(--line);}
  .pedal .track .fill{height:100%;width:0%;transition:width .12s linear;}
  .pedal.throttle .fill{background:var(--green);}
  .pedal.brake .fill{background:var(--red);}

  .warn-strip{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:9px;letter-spacing:.12em;color:var(--label-dim);text-transform:uppercase;font-weight:700;}
  .warn-strip .item{display:flex;align-items:center;gap:5px;}
  .warn-strip .dot{width:6px;height:6px;border-radius:50%;background:var(--label-dim);}
  .warn-strip .dot.on{background:var(--green);box-shadow:0 0 5px var(--green);}
  .warn-strip .dot.on.amber{background:var(--amber);box-shadow:0 0 5px var(--amber);}
</style>
</head>

<script>
(function(){
  // ---------- Fullscreen ----------
  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', function(){
    const el = document.documentElement;
    if(!document.fullscreenElement){
      (el.requestFullscreen && el.requestFullscreen()) ||
      (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(()=>{});
      }
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

  // ---------- Gauge ticks ----------
  const ticksG = document.getElementById('ticks');
  const cx=100, cy=108, rOuter=86, rInnerMajor=76, rInnerMinor=80;
  function polar(deg, r){
    const rad = (deg-90) * Math.PI/180;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  function arcPath(a1,a2,r){
    const [x1,y1]=polar(a1,r), [x2,y2]=polar(a2,r);
    const largeArc = Math.abs(a2-a1) > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`;
  }
  document.getElementById('redlineL').setAttribute('d', arcPath(-90,-72,86));
  document.getElementById('redlineR').setAttribute('d', arcPath(72,90,86));

  for(let a=-90; a<=90; a+=15){
    const isMajor = a % 30 === 0;
    const [x1,y1] = polar(a, rOuter);
    const [x2,y2] = polar(a, isMajor ? rInnerMajor : rInnerMinor);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke', isMajor ? '#9a9a9f' : '#3f3f43');
    line.setAttribute('stroke-width', isMajor ? 1.8 : 1);
    ticksG.appendChild(line);
    if(isMajor){
      const [tx,ty] = polar(a, rInnerMajor-13);
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x',tx);text.setAttribute('y',ty+3);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('font-size','9');
      text.setAttribute('font-family','Rajdhani, sans-serif');
      text.setAttribute('font-weight','700');
      text.setAttribute('fill','#5c5c62');
      text.textContent = Math.abs(a);
      ticksG.appendChild(text);
    }
  }

  // ---------- State ----------
  let speed = 0, targetSpeed = 40;
  let angle = 0, targetAngle = 0;
  let battery = 82;
  let motorTemp = 41;
  let motorRpm = 2400;
  let throttle = 0, brake = 0;

  const speedVal = document.getElementById('speedVal');
  const angleVal = document.getElementById('angleVal');
  const angleDir = document.getElementById('angleDir');
  const dirFill = document.getElementById('dirFill');
  const needleGroup = document.getElementById('needleGroup');
  const accelFill = document.getElementById('accelFill');
  const accelCaption = document.getElementById('accelCaption');
  const battVal = document.getElementById('battVal');
  const battFill = document.getElementById('battFill');
  const tempVal = document.getElementById('tempVal');
  const tempFill = document.getElementById('tempFill');
  const rpmVal = document.getElementById('rpmVal');
  const rpmFill = document.getElementById('rpmFill');
  const throttleFill = document.getElementById('throttleFill');
  const brakeFill = document.getElementById('brakeFill');

  function rw(current, target, maxStep){
    const d = target - current;
    return current + Math.max(-maxStep, Math.min(maxStep, d*0.12 + (Math.random()-0.5)*maxStep*0.4));
  }

  let lastSpeedForAccel = 0;
  function tick(){
    if(Math.random() < 0.02) targetSpeed = 15 + Math.random()*95;
    if(Math.random() < 0.05) targetAngle = (Math.random()-0.5)*160;

    speed = Math.max(0, rw(speed, targetSpeed, 3.2));
    angle = Math.max(-90, Math.min(90, rw(angle, targetAngle, 6)));

    const accel = (speed - lastSpeedForAccel);
    lastSpeedForAccel = speed;

    battery = Math.max(4, battery - 0.0025 - Math.abs(accel)*0.0006);
    motorTemp = Math.max(32, Math.min(92, motorTemp + (speed/120)*0.06 - 0.05 + (Math.random()-0.5)*0.3));
    motorRpm = Math.max(0, speed * 78 + (Math.random()-0.5)*150);

    throttle = Math.max(0, Math.min(100, throttle + (accel>0? 6:-8) + (Math.random()-0.5)*6));
    brake = Math.max(0, Math.min(100, accel < -1.2 ? 60+Math.random()*40 : brake*0.8));

    speedVal.textContent = String(Math.round(speed)).padStart(3,'0');
    angleVal.textContent = Math.round(Math.abs(angle));
    angleDir.textContent = Math.abs(angle) < 2 ? 'CENTRO' : (angle < 0 ? 'IZQUIERDA' : 'DERECHA');

    needleGroup.setAttribute('transform', `rotate(${angle} ${cx} ${cy})`);

    const dirPct = 50 + (angle/90)*50;
    if(angle >= 0){ dirFill.style.left='50%'; dirFill.style.width=(dirPct-50)+'%'; }
    else { dirFill.style.left=dirPct+'%'; dirFill.style.width=(50-dirPct)+'%'; }

    const accelPct = Math.max(-50, Math.min(50, accel*14));
    if(accelPct >= 0){
      accelFill.style.left='50%'; accelFill.style.width=accelPct+'%'; accelFill.style.background='var(--green)';
    } else {
      accelFill.style.left=(50+accelPct)+'%'; accelFill.style.width=(-accelPct)+'%'; accelFill.style.background='var(--red)';
    }
    accelCaption.textContent = 'Aceleración · ' + (accel/3.6).toFixed(2) + ' g';

    battVal.innerHTML = Math.round(battery) + '<span class="u">%</span>';
    battFill.style.width = battery + '%';
    battFill.style.background = battery < 15 ? 'var(--red)' : battery < 35 ? 'var(--amber)' : 'var(--green)';

    tempVal.innerHTML = Math.round(motorTemp) + '<span class="u">°C</span>';
    tempFill.style.width = Math.min(100,(motorTemp/95)*100) + '%';
    tempFill.style.background = motorTemp > 78 ? 'var(--red)' : motorTemp > 62 ? 'var(--amber)' : 'var(--green)';

    rpmVal.innerHTML = Math.round(motorRpm) + '<span class="u">rpm</span>';
    rpmFill.style.width = Math.min(100,(motorRpm/9500)*100) + '%';

    throttleFill.style.width = throttle + '%';
    brakeFill.style.width = brake + '%';
  }

  setInterval(tick, 100);
  tick();
})();
</script>
</body>
</html>
